# DeadlineWatch runtime configuration (key = value, '#' starts a comment).
# Command-line flags override these values (see README.md).
#
# Timing is in milliseconds; priorities are QNX scheduling priorities
# (higher number = more urgent). Effective priorities are clamped into
# [sched_get_priority_min(SCHED_FIFO), sched_get_priority_max(SCHED_FIFO)]
# at startup and printed, so the numbers below are intent, not gospel.

# Periods
control_period_ms   = 10
sensor_period_ms    = 50

# Priorities (defaults; see docs/design-8.0.md for why the rogue starts high)
supervisor_prio     = 30
control_prio        = 20
sensor_prio         = 15
rogue_prio          = 25
rogue_demoted_prio  = 5

# Rogue behaviour: burns rogue_duty_pct of each rogue_work_window_ms window.
rogue_duty_pct      = 85
rogue_work_window_ms = 10
rogue_threads       = 0    # 0 = one rogue thread per online CPU

# Workload size (iterations of the stand-in compute loop). Calibrate on the
# target so the control loop's work takes ~1 ms; see README.md.
control_work_iters  = 200000
sensor_work_iters   = 50000

# Modes
mode                = local  # local = built-in threads; system = guard other processes
guard_on            = 1    # 1 = enforce (demote offenders on 2 misses), 0 = measure only
rogue_on            = 1    # local mode: 1 = start the rogue threads, 0 = control-only run
duration_s          = 30   # 0 = run until Ctrl-C / SIGTERM
live                = 1    # print a live status line every second

# Safe state (after THROTTLE and ESCALATE are used up, or nothing can be
# demoted): a critical task failing continuously for safe_after_ms, or
# missing safe_miss_pct % of a 1 s window, is commanded to its safe state.
# Set both to 0 to disable. QEMU/TCG host stalls of 130-185 ms were seen;
# keep safe_after_ms well above that on emulated targets.
safe_after_ms       = 300
safe_miss_pct       = 50
rescue_boost        = 1    # boost critical threads to supervisor_prio-1 on safe state

# Black-box log (CSV) written in the guest's working directory.
log_path            = deadline-watch.csv
